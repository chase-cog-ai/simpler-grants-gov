name: Frontend E2E Chrome Apply Required Form
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/ci-frontend-e2e-chrome-apply-required-form.yml

defaults:
  run:
    working-directory: ./frontend

env:
  NODE_VERSION: 24
  LOCKFILE_PATH: ./frontend/package-lock.json
  PACKAGE_MANAGER: npm
  NODE_OPTIONS: --dns-result-order=ipv4first

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-chrome-apply-required-form:
    name: Run Chrome Apply Required Form E2E
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
          cache-dependency-path: ${{ env.LOCKFILE_PATH }}

      - name: Install dependencies and Playwright
        # Workaround for npm ci EEXIST cache error:
        # npm error code EEXIST
        # Process exit code 239
        # npm error path /home/runner/.npm/_cacache/tmp/1aaf648b
        # Remove the existing file and try again, or run npm
        run: |
          npm cache clean --force
          npm ci
          npx playwright install --with-deps

      - name: Start API Server for e2e tests
        run: |
          cd ../api
          # Enable core dumps for debugging segfaults
          ulimit -c unlimited
          mkdir -p /tmp/cores
          echo "/tmp/cores/core.%e.%p.%t" | sudo tee /proc/sys/kernel/core_pattern
          # Run init first to generate JWT keys in override.env
          make init
          # Now run the seeding and populate commands
          echo "LOGIN_FINAL_DESTINATION=http://localhost:3000/api/auth/callback" >> override.env
          make db-seed-local-with-agencies populate-search-opportunities populate-search-agencies start
          cd ../frontend
          # Ensure the API wait script is executable
          chmod +x ../api/bin/wait-for-api.sh
          ../api/bin/wait-for-api.sh
        shell: bash

      - name: Build a prod version of the site
        run: |
          {
            cat .env.development
            sed -En '/API_JWT_PUBLIC_KEY/,/-----END PUBLIC KEY-----/p' ../api/override.env
            cat ../api/e2e_token.tmp
          } >> .env.local
          # Use the 127.0.0.1 url for tests (IPv4 only)
          sed -i 's|^SENDY_API_URL=.*|SENDY_API_URL=http://127.0.0.1:3000|' .env.local
          npm run build -- --no-lint

      - name: Export session secrets for web server
        run: |
          set -a
          source .env.local
          set +a
          {
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "E2E_USER_AUTH_TOKEN=$E2E_USER_AUTH_TOKEN"
            printf 'API_JWT_PUBLIC_KEY<<EOF\n%s\nEOF\n' "$API_JWT_PUBLIC_KEY"
          } >> "$GITHUB_ENV"

      - name: Run Chrome apply required form test
        env:
          CI: true
        run: |
          npm run test:e2e -- --project=Chrome tests/e2e/apply/happy-path-apply-req-form-workflow.spec.ts

      - name: Debug logging on failure
        if: failure()
        run: |
          cd ../api
          echo "=== API Container Logs ==="
          docker logs grants-api || echo "Could not retrieve API logs"
          echo ""
          echo "=== OpenSearch Container Logs ==="
          docker logs opensearch-node || echo "Could not retrieve OpenSearch logs"
          echo ""
          echo "=== Container Status ==="
          docker ps -a
          echo ""
          echo "=== Images ==="
          docker image ls
          echo ""
          echo "=== Disk free ==="
          df -h
          echo ""
        shell: bash

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-apply-required-form-report
          path: /home/runner/work/simpler-grants-gov/simpler-grants-gov/frontend/playwright-report
          retention-days: 7